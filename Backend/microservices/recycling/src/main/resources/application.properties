spring.application.name=recycling
server.port=${SERVER_PORT:8083}

# Defaults match the development database in ../compose.yaml.
spring.datasource.url=${RECYCLING_DB_URL:jdbc:mysql://localhost:3307/recycling_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${RECYCLING_DB_USERNAME:eco}
spring.datasource.password=${RECYCLING_DB_PASSWORD:eco_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No entities or schema migrations are implemented yet.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
