spring.application.name=notification
server.port=${SERVER_PORT:8087}

# Each service owns its own in-memory database. Data resets on restart.
spring.datasource.url=jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# No entities or schema migrations are implemented yet.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
